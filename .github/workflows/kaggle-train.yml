name: Kaggle training

on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: Kaggle accelerator
        required: false
        default: NvidiaTeslaT4
      skip_model_upload:
        description: Skip model dataset upload if already on Kaggle
        required: false
        default: 'false'
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'scripts/**'
      - 'configs/**'
      - 'kaggle/**'
      - 'requirements.txt'
      - '.github/workflows/kaggle-train.yml'

permissions:
  contents: read

jobs:
  push-and-run-kaggle:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MODEL_ID: ai4bharat/indictrans2-en-indic-dist-200M
      KAGGLE_MODEL_DATASET: janaiworkspace/indictrans2-en-indic-200m

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "KAGGLE_API_TOKEN is missing"; exit 1; }
          echo "KAGGLE_API_TOKEN is available"
          test -n "$HF_TOKEN" || { echo "HF_TOKEN is missing"; exit 1; }
          echo "HF_TOKEN is available"

      - name: Notify Telegram - training started
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=8882400158" \
              --data-urlencode "text=Santali AI training started. Preparing dataset and model for Kaggle GPU."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CLI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle "huggingface_hub[cli]" pyyaml

      - name: Enforce licensed corpus gate
        run: |
          python scripts/audit_corpus.py --output-dir .corpus-audit
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.corpus-audit/dataset-metadata.json').read_text())
          approved_parallel = [
              source for source in report['sources']
              if source['eligible_for_kaggle_training'] == 'true'
              and source['kind'] == 'parallel_text'
          ]
          print(f"Approved parallel source count: {len(approved_parallel)}")
          Path('.github-training-ready').write_text('true\n' if approved_parallel else 'false\n')
          PY
          if grep -qx true .github-training-ready; then
            echo "PARALLEL_TRAINING_READY=true" >> "$GITHUB_ENV"
            echo "Licensed parallel source is ready."
          else
            echo "PARALLEL_TRAINING_READY=false" >> "$GITHUB_ENV"
            echo "Training safely skipped: no approved parallel_text source is ready."
            {
              echo '## Training skipped safely'
              echo
              echo 'No approved parallel_text source currently has verified license, training permission, redistribution permission, attribution, and SHA-256 metadata.'
              echo 'The workflow completed without uploading data or starting Kaggle training.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare approved parallel dataset
        if: ${{ env.PARALLEL_TRAINING_READY == 'true' }}
        run: python scripts/prepare_licensed_kaggle_dataset.py --output-dir .kaggle-dataset

      - name: Create or update private parallel dataset
        if: ${{ env.PARALLEL_TRAINING_READY == 'true' }}
        run: |
          if kaggle datasets status janaiworkspace/approved-parallel >/dev/null 2>&1; then
            kaggle datasets version -p .kaggle-dataset -m "Refresh approved Mod4 corpus" -q -t -r skip
          else
            kaggle datasets create -p .kaggle-dataset -q -t -r skip
          fi

      - name: Download IndicTrans2 model
        if: ${{ env.PARALLEL_TRAINING_READY == 'true' && github.event.inputs.skip_model_upload != 'true' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from huggingface_hub import login, snapshot_download
          token = os.environ.get("HF_TOKEN")
          login(token=token, add_to_git_credential=False)
          snapshot_download(repo_id=os.environ["HF_MODEL_ID"], local_dir=".kaggle-model", token=token)
          Path(".kaggle-model/dataset-metadata.json").write_text(json.dumps({
              "title": "IndicTrans2 En-Indic 200M",
              "id": os.environ["KAGGLE_MODEL_DATASET"],
              "licenses": [{"name": "MIT"}]
          }, indent=2))
          print("Model downloaded and metadata written")
          PY
          rm -rf .kaggle-model/.cache .kaggle-model/.gitattributes 2>/dev/null || true

      - name: Create or update private model dataset
        if: ${{ env.PARALLEL_TRAINING_READY == 'true' && github.event.inputs.skip_model_upload != 'true' }}
        run: |
          if kaggle datasets status "$KAGGLE_MODEL_DATASET" >/dev/null 2>&1; then
            kaggle datasets version -p .kaggle-model -m "Refresh IndicTrans2 weights" -q -t -r skip
          else
            kaggle datasets create -p .kaggle-model -q -t -r skip
          fi

      - name: Wait for model dataset availability
        if: ${{ env.PARALLEL_TRAINING_READY == 'true' }}
        run: |
          echo "Waiting for $KAGGLE_MODEL_DATASET to become attachable..."
          for attempt in $(seq 1 30); do
            if kaggle datasets status "$KAGGLE_MODEL_DATASET" >/tmp/model-dataset-status.txt 2>&1; then
              if kaggle datasets files "$KAGGLE_MODEL_DATASET" --page-size 200 -v >/tmp/model-dataset-files.csv 2>&1; then
                if grep -Fq "config.json" /tmp/model-dataset-files.csv; then
                  echo "Model dataset is available and contains config.json."
                  exit 0
                fi
              fi
            fi
            echo "Attempt $attempt/30: model dataset is not ready yet."
            sleep 10
          done
          echo "Model dataset did not become attachable or is missing config.json."
          cat /tmp/model-dataset-status.txt 2>/dev/null || true
          cat /tmp/model-dataset-files.csv 2>/dev/null || true
          exit 1

      - name: Ensure kernel metadata inputs
        if: ${{ env.PARALLEL_TRAINING_READY == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("kaggle/kernel/kernel-metadata.json")
          m = json.loads(p.read_text())
          m["dataset_sources"] = ["janaiworkspace/approved-parallel", "janaiworkspace/indictrans2-en-indic-200m"]
          m["enable_gpu"] = True
          m["enable_internet"] = True
          p.write_text(json.dumps(m, indent=2) + "\n")
          PY

      - name: Push and run Kaggle kernel
        if: ${{ env.PARALLEL_TRAINING_READY == 'true' }}
        env:
          ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}
        run: kaggle kernels push -p kaggle/kernel --accelerator "$ACCELERATOR" --timeout 7200

      - name: Print Kaggle kernel status
        if: ${{ env.PARALLEL_TRAINING_READY == 'true' }}
        continue-on-error: true
        run: |
          KERNEL_ID=$(python -c "import json; print(json.load(open('kaggle/kernel/kernel-metadata.json'))['id'])")
          kaggle kernels status "$KERNEL_ID" || true

      - name: Notify Telegram - workflow finished
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            if [ "$PARALLEL_TRAINING_READY" != "true" ]; then
              JOB_STATUS="blocked-safely-no-approved-parallel-data"
            fi
            curl --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=8882400158" \
              --data-urlencode "text=Santali AI GitHub workflow finished: ${JOB_STATUS}. Kaggle: https://www.kaggle.com/code/janaiworkspace/santali-ai-translation"
          fi
