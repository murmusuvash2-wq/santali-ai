name: Kaggle training

on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: Kaggle accelerator
        required: false
        default: NvidiaTeslaT4
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'scripts/**'
      - 'configs/**'
      - 'kaggle/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  push-and-run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Setup Kaggle Authentication
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "❌ Missing KAGGLE_USERNAME or KAGGLE_KEY secrets!"
            exit 1
          fi
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "✅ Authentication configured successfully"

      - name: Push and run Kaggle kernel
        env:
          ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}
        run: |
          echo "🚀 Pushing kernel to Kaggle..."
          kaggle kernels push -p kaggle/kernel --accelerator "$ACCELERATOR" --timeout 7200
          echo "✅ Kernel pushed successfully!"

      - name: Print Kaggle kernel status (Optional - Won't fail workflow)
        continue-on-error: true
        run: |
          echo "📊 Attempting to fetch kernel status..."
          
          # Check if metadata file exists
          if [ ! -f "kaggle/kernel/kernel-metadata.json" ]; then
            echo "⚠️ kernel-metadata.json not found - skipping status check"
            exit 0
          fi
          
          # Try to extract kernel ID
          KERNEL_ID=$(python -c "
          import json
          try:
              data = json.load(open('kaggle/kernel/kernel-metadata.json'))
              # Try different possible field names
              kernel_id = data.get('id') or data.get('slug') or data.get('ref')
              if kernel_id:
                  print(kernel_id)
              else:
                  print('')
          except Exception as e:
              print('')
          " 2>/dev/null)
          
          if [ -n "$KERNEL_ID" ]; then
            echo "Fetching status for: $KERNEL_ID"
            kaggle kernels status "$KERNEL_ID" || echo "⚠️ Could not fetch status (but kernel was pushed successfully)"
          else
            echo "ℹ️ Kernel ID not found in metadata - but kernel was pushed successfully!"
            echo "👉 Check your Kaggle profile to see the running kernel"
          fi
