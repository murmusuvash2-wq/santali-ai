name: Kaggle training

on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: Kaggle accelerator
        required: false
        default: NvidiaTeslaT4
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'scripts/**'
      - 'configs/**'
      - 'kaggle/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  push-and-run-kaggle:
    if: ${{ secrets.KAGGLE_API_TOKEN != '' && secrets.KAGGLE_USERNAME != '' }}
    runs-on: ubuntu-latest
    # Required repository secrets: KAGGLE_API_TOKEN and KAGGLE_USERNAME.
    # The Kaggle account must have a kernel with the slug in kaggle/kernel-metadata.json.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Configure Kaggle authentication
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          test -n "$KAGGLE_API_TOKEN" || (echo 'Missing KAGGLE_API_TOKEN secret' && exit 1)
          test -n "$KAGGLE_USERNAME" || (echo 'Missing KAGGLE_USERNAME secret' && exit 1)

      - name: Push and run Kaggle kernel
        env:
          ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}
        run: |
          kaggle kernels push -p kaggle/kernel --accelerator "$ACCELERATOR" --timeout 7200

      - name: Print Kaggle kernel status
        run: kaggle kernels status "$(python -c "import json; print(json.load(open('kaggle/kernel/kernel-metadata.json'))['id'])")"
