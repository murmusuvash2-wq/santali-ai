name: Kaggle training

on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: Kaggle accelerator
        required: false
        default: NvidiaTeslaT4
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'scripts/**'
      - 'configs/**'
      - 'kaggle/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  push-and-run-kaggle:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Kaggle Secret
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "❌ FATAL ERROR: GitHub Actions is passing an EMPTY secret!"
            echo "👉 Check: Repo Settings > Secrets and variables > Actions"
            echo "👉 Ensure name is EXACTLY: KAGGLE_API_TOKEN (NO spaces, NO extra characters)"
            exit 1
          else
            echo "✅ SUCCESS: Secret is loaded! Length: ${#KAGGLE_API_TOKEN} characters."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Push and run Kaggle kernel
        env:
          ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}
        run: |
          echo "🚀 Pushing kernel to Kaggle..."
          kaggle kernels push -p kaggle/kernel --accelerator "$ACCELERATOR" --timeout 7200

      - name: Print Kaggle kernel status
        run: |
          KERNEL_ID=$(python -c "import json; print(json.load(open('kaggle/kernel/kernel-metadata.json'))['id'])" 2>/dev/null || echo "")
          if [ -n "$KERNEL_ID" ]; then
            echo "📊 Fetching status for kernel: $KERNEL_ID"
            kaggle kernels status "$KERNEL_ID"
          else
            echo "⚠️ Warning: Could not read kernel ID."
          fi
