name: Kaggle training

on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: Kaggle accelerator
        required: false
        default: NvidiaTeslaT4
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'scripts/**'
      - 'configs/**'
      - 'kaggle/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  push-and-run-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Push and run Kaggle kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}
        run: |
          # 1. Check if token is present
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "❌ Error: KAGGLE_API_TOKEN secret is missing!"
            exit 1
          fi
          
          # 2. Push the kernel (Kaggle CLI automatically reads KAGGLE_API_TOKEN from env)
          echo "🚀 Pushing kernel to Kaggle..."
          kaggle kernels push -p kaggle/kernel --accelerator "$ACCELERATOR" --timeout 7200

      - name: Print Kaggle kernel status
        run: |
          # Safely extract kernel ID to avoid crashes if file is missing/malformed
          KERNEL_ID=$(python -c "import json; print(json.load(open('kaggle/kernel/kernel-metadata.json'))['id'])" 2>/dev/null || echo "")
          
          if [ -n "$KERNEL_ID" ]; then
            echo "📊 Fetching status for kernel: $KERNEL_ID"
            kaggle kernels status "$KERNEL_ID"
          else
            echo "⚠️ Warning: Could not read kernel ID from kaggle/kernel/kernel-metadata.json"
          fi
