name: Kaggle training

on:
  workflow_dispatch:
    inputs:
      accelerator:
        description: Kaggle accelerator
        required: false
        default: NvidiaTeslaT4
      skip_model_upload:
        description: Skip model dataset upload if already on Kaggle
        required: false
        default: 'false'
  push:
    branches: [main]
    paths:
      - 'training/**'
      - 'scripts/**'
      - 'configs/**'
      - 'kaggle/**'
      - 'requirements.txt'
      - '.github/workflows/kaggle-train.yml'

permissions:
  contents: read

jobs:
  push-and-run-kaggle:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_MODEL_ID: ai4bharat/indictrans2-indic-indic-dist-320M
      KAGGLE_MODEL_DATASET: ezqrio/indictrans2-320m

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Kaggle Secret
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "FATAL ERROR: GitHub Actions is passing an EMPTY secret. Check the exact name KAGGLE_API_TOKEN."
            exit 1
          else
            echo "SUCCESS: Kaggle secret is loaded."
          fi

      - name: Notify Telegram - training started
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=8882400158" \
              --data-urlencode "text=Santali AI training started. Model + data will be pushed to Kaggle. Track: https://www.kaggle.com/code/ezqrio/santali-ai-translation"
          else
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN secret is not configured."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CLI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade kaggle huggingface_hub

      - name: Prepare approved parallel dataset
        run: python scripts/prepare_mod4_kaggle_dataset.py --output-dir .kaggle-dataset

      - name: Create or update private parallel dataset
        run: |
          if kaggle datasets status ezqrio/approved-parallel >/dev/null 2>&1; then
            kaggle datasets version -p .kaggle-dataset -m "Refresh approved Mod4 corpus" -q -t -r skip
          else
            kaggle datasets create -p .kaggle-dataset -q -t -r skip
          fi

      - name: Download IndicTrans2 model (GitHub Actions has internet)
        if: ${{ github.event.inputs.skip_model_upload != 'true' }}
        run: |
          set -e
          mkdir -p .kaggle-model
          python - <<'PY'
          from huggingface_hub import snapshot_download
          import os
          path = snapshot_download(
              repo_id=os.environ["HF_MODEL_ID"],
              local_dir=".kaggle-model",
              local_dir_use_symlinks=False,
          )
          print("Downloaded model to", path)
          PY
          # Kaggle dataset metadata
          cat > .kaggle-model/dataset-metadata.json <<'EOF'
          {
            "title": "IndicTrans2 320M (Indic-Indic dist)",
            "id": "ezqrio/indictrans2-320m",
            "licenses": [{"name": "MIT"}]
          }
          EOF
          # Remove git / cache junk if any
          rm -rf .kaggle-model/.cache .kaggle-model/.gitattributes || true
          echo "Model folder size:"
          du -sh .kaggle-model
          ls -la .kaggle-model | head -30

      - name: Create or update model dataset on Kaggle
        if: ${{ github.event.inputs.skip_model_upload != 'true' }}
        run: |
          set -e
          if kaggle datasets status "$KAGGLE_MODEL_DATASET" >/dev/null 2>&1; then
            echo "Updating existing model dataset $KAGGLE_MODEL_DATASET"
            kaggle datasets version -p .kaggle-model -m "Refresh IndicTrans2 320M weights" -q -t -r skip
          else
            echo "Creating model dataset $KAGGLE_MODEL_DATASET"
            kaggle datasets create -p .kaggle-model -q -t -r skip
          fi
          echo "Model dataset ready: https://www.kaggle.com/datasets/ezqrio/indictrans2-320m"

      - name: Ensure kernel metadata attaches model + data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta_path = Path("kaggle/kernel/kernel-metadata.json")
          meta = json.loads(meta_path.read_text())
          sources = meta.get("dataset_sources") or []
          for ds in ["ezqrio/approved-parallel", "ezqrio/indictrans2-320m"]:
              if ds not in sources:
                  sources.append(ds)
          meta["dataset_sources"] = sources
          meta["enable_internet"] = True
          meta["enable_gpu"] = True
          meta_path.write_text(json.dumps(meta, indent=2) + "\n")
          print(meta_path.read_text())
          PY

      - name: Push and run Kaggle kernel
        env:
          ACCELERATOR: ${{ inputs.accelerator || 'NvidiaTeslaT4' }}
        run: |
          echo "Pushing kernel to Kaggle..."
          kaggle kernels push -p kaggle/kernel --accelerator "$ACCELERATOR" --timeout 7200

      - name: Print Kaggle kernel status
        run: |
          KERNEL_ID=$(python -c "import json; print(json.load(open('kaggle/kernel/kernel-metadata.json'))['id'])" 2>/dev/null || echo "")
          if [ -n "$KERNEL_ID" ]; then
            echo "Fetching status for kernel: $KERNEL_ID"
            kaggle kernels status "$KERNEL_ID"
          else
            echo "Warning: Could not read kernel ID."
          fi

      - name: Notify Telegram - training finished
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            curl --fail --silent --show-error -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=8882400158" \
              --data-urlencode "text=Santali AI training workflow finished with status: ${JOB_STATUS}. Kaggle kernel: https://www.kaggle.com/code/ezqrio/santali-ai-translation. Open GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN secret is not configured."
          fi
