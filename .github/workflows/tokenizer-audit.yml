name: Tokenizer audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_tokenizer.py'
      - 'data/raw/mmloso-2025/santali-train.csv'
      - '.github/workflows/tokenizer-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MODEL_ID: ai4bharat/indictrans2-en-indic-dist-200M
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Hugging Face secret
        run: test -n "$HF_TOKEN" || { echo "HF_TOKEN is missing"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tokenizer dependencies
        run: python -m pip install --upgrade transformers sentencepiece huggingface_hub

      - name: Download gated tokenizer/model files
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import login, snapshot_download
          login(token=os.environ['HF_TOKEN'], add_to_git_credential=False)
          snapshot_download(
              repo_id=os.environ['HF_MODEL_ID'],
              local_dir='.audit-model',
              token=os.environ['HF_TOKEN'],
              allow_patterns=[
                  'config.json',
                  'tokenizer*',
                  '*.model',
                  '*.json',
                  '*.py',
              ],
          )
          PY

      - name: Run tokenizer audit
        run: |
          python scripts/audit_tokenizer.py \
            --model .audit-model \
            --input data/raw/mmloso-2025/santali-train.csv \
            --output tokenizer-audit.json \
            --limit 1000 \
            --max-length 128

      - name: Publish tokenizer report
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer-audit-${{ github.run_id }}
          path: tokenizer-audit.json
          retention-days: 90

      - name: Add report summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open('tokenizer-audit.json', encoding='utf-8'))
          health = report['tokenizer_health']
          print('## Tokenizer audit')
          print(f"- Health score: **{health['score']}/100 ({health['level']})**")
          print(f"- Unknown-token rate: `{report['stats'][1]['unknown_token_rate']}`")
          print(f"- Santali truncation rate: `{report['stats'][1]['truncation_rate']}`")
          print('')
          print('This is a tokenizer-health proxy, not a translation-quality score.')
          PY
